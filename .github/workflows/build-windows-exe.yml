name: Budowanie EXE dla Windows

"on":
  workflow_dispatch:
    inputs:
      python-version:
        description: "Wersja Pythona używana do budowania aplikacji"
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"
      publish-release:
        description: "Opublikuj wynik jako trwały GitHub Release"
        required: true
        default: false
        type: boolean
      release-tag:
        description: "Tag wydania, np. neurosim-v0.3.0; wymagany przy publikacji"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-windows-exe:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Budowanie paczki NeuroSim EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Zainstaluj zależności aplikacji i PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller pyinstaller-hooks-contrib

      - name: Zbuduj aplikację standalone
        run: python scripts/build_exe.py

      - name: Sprawdź wynik budowania
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/NeuroSim/NeuroSim.exe")) {
            Write-Error "Nie znaleziono pliku dist/NeuroSim/NeuroSim.exe"
          }

      - name: Spakuj katalog aplikacji
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Compress-Archive `
            -Path dist/NeuroSim/* `
            -DestinationPath artifact/NeuroSim-Windows.zip `
            -Force

      - name: Waliduj żądanie trwałego wydania
        if: ${{ inputs.publish-release }}
        shell: bash
        run: |
          test -n "${{ inputs.release-tag }}" || {
            echo "::error::release-tag jest wymagany przy publish-release=true"
            exit 2
          }

      - name: Udostępnij artefakt do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSim-Windows-${{ github.run_number }}
          path: artifact/NeuroSim-Windows.zip
          if-no-files-found: error
          retention-days: 3

      - name: Wylicz SHA-256
        if: ${{ inputs.publish-release }}
        shell: pwsh
        run: |
          (Get-FileHash artifact/NeuroSim-Windows.zip -Algorithm SHA256).Hash.ToLower() + "  NeuroSim-Windows.zip" | Out-File -Encoding ascii artifact/SHA256SUMS.txt

      - name: Opublikuj trwały GitHub Release
        if: ${{ inputs.publish-release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release-tag }}
          target_commitish: ${{ github.sha }}
          name: "NeuroSim ${{ inputs.release-tag }}"
          files: |
            artifact/NeuroSim-Windows.zip
            artifact/SHA256SUMS.txt

      - name: Usuń przejściowy artefakt Actions po wydaniu
        if: ${{ success() && inputs.publish-release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == ${{ github.run_id }}) | .id' \
          | while read -r artifact_id; do
              [ -z "$artifact_id" ] && continue
              gh api --method DELETE \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
            done
